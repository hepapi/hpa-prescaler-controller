# ApplicationSet producing multi-source Argo Apps (helm chart + values ref)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: demo-appset-a
            minReplicas: "1"
            maxReplicas: "2"
          - name: demo-appset-b
            minReplicas: "1"
            maxReplicas: "2"
  template:
    metadata:
      name: "{{ .name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        # Values repo (ref-only) — collected via $values/... valueFiles
        - repoURL: file:///demo-charts
          targetRevision: HEAD
          ref: values
        # Actual helm chart source — HPA params must be applied here
        - repoURL: file:///demo-charts
          path: demo-app
          targetRevision: HEAD
          helm:
            valueFiles:
              - $values/overlays/demo/values.yaml
            parameters:
              - name: nameOverride
                value: "{{ .name }}"
              - name: autoscaling.enabled
                value: "true"
              - name: autoscaling.minReplicas
                value: "{{ .minReplicas }}"
              - name: autoscaling.maxReplicas
                value: "{{ .maxReplicas }}"
      destination:
        name: in-cluster
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
