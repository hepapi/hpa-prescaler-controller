apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hpaprescalercronjobs.hepapi.com
spec:
  scope: Namespaced
  group: hepapi.com
  names:
    kind: HpaPrescalerCronjob
    plural: hpaprescalercronjobs
    singular: hpaprescalercronjob
    shortNames:
      - hpacronjob
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                isActive:
                  type: boolean
                  default: true
                schedule:
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "schedule field is immutable. delete and create a new one"
                  type: string
                  description: "Cron schedule string (e.g., '0 0 * * *' for daily at midnight)"
                jobCount:
                  type: integer
                  minimum: 1
                  default: 3
                  description: "Number of prescaler jobs to create when the cron schedule triggers"
                prescalerSpec:
                  type: object
                  properties:
                    argocdAppName:
                      type: string
                    timeStart:
                      type: string
                    targetProfileName:
                      type: string
                    scaleType:
                      type: string
                      enum:
                        - UP
                        - DOWN
                      nullable: true
                  required:
                    - argocdAppName
                    - targetProfileName
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
      - name: Active
        type: boolean
        jsonPath: .spec.isActive
      - name: Schedule
        type: string
        jsonPath: .spec.schedule
      - name: ArgoApp
        type: string
        jsonPath: .spec.prescalerSpec.argocdAppName
      - name: Profile
        type: string
        jsonPath: .spec.prescalerSpec.targetProfileName
      - name: ScaleType
        type: string
        jsonPath: .spec.prescalerSpec.scaleType
